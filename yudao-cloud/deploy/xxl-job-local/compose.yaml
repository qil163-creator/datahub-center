name: datahub-xxl-local

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl_job
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在本地 .env 设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在本地 .env 设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./runtime/tables_xxl_job.sql
        target: /docker-entrypoint-initdb.d/01-tables_xxl_job.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  admin:
    image: xuxueli/xxl-job-admin:2.4.0
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:18989:8080
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Duser.timezone=Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: xxl_job
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在本地 .env 设置 MYSQL_PASSWORD}
      XXL_JOB_ACCESSTOKEN: ${XXL_JOB_ACCESS_TOKEN:?请在本地 .env 设置 XXL_JOB_ACCESS_TOKEN}
    volumes:
      - admin-logs:/data/applogs

volumes:
  mysql-data:
  admin-logs:
